name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pancake-formal
          key: pancake-formal-${{ hashFiles('tools/formal/*/coverage.json') }}
      - run: npm ci
      - run: npm run check:gate -- -- --install
