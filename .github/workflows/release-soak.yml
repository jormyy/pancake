name: Release soak

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: release-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1
      - run: npm ci
      - name: Start release stack
        shell: bash
        run: |
          head_name="$(find supabase/migrations -maxdepth 1 -name '*.sql' -exec basename {} \; | sort | tail -1)"
          probe_name="$head_name"
          probe_version="${probe_name%%_*}"
          base_name="$(find supabase/migrations -maxdepth 1 -name '*.sql' -exec basename {} \; | sort | tail -2 | head -1)"
          base_version="${base_name%%_*}"
          test "$base_version" \< "$probe_version" || {
            echo "Mid-life base $base_name does not precede probe $probe_name"
            exit 1
          }
          probe_migration="supabase/migrations/$probe_name"
          mv "$probe_migration" "/tmp/$probe_name"
          trap 'mv "/tmp/$probe_name" "$probe_migration"' EXIT
          supabase start
          mv "/tmp/$probe_name" "$probe_migration"
          trap - EXIT
          source <(supabase status -o env)
          export EXPO_PUBLIC_SUPABASE_URL="$API_URL"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export EXPO_PUBLIC_API_URL="$API_URL/functions/v1/api"
          mkdir -p tests/artifacts/stack
          printf 'E2E_SUPABASE_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'E2E_PANCAKE_SUPABASE_SECRET_KEY=%s\n' "$SECRET_KEY" >> "$GITHUB_ENV"
          printf 'E2E_SUPABASE_PUBLISHABLE_KEY=%s\n' "$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          printf 'SUPABASE_DB_URL=%s\n' "$DB_URL" >> "$GITHUB_ENV"
          printf 'E2E_API_BASE_URL=%s/functions/v1/api\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'E2E_FRONTEND_URL=http://127.0.0.1:8082\n' >> "$GITHUB_ENV"
          printf 'E2E_ADMIN_SECRET=local-release-soak-secret\n' >> "$GITHUB_ENV"
          printf 'E2E_MIDLIFE_EXPECTED_VERSION=%s\n' "$probe_version" >> "$GITHUB_ENV"
          printf 'E2E_MIDLIFE_EXPECTED_BASE_VERSION=%s\n' "$base_version" >> "$GITHUB_ENV"
          printf 'FAKE_UPSTREAM_PORT=4555\n' >> "$GITHUB_ENV"
          cat > /tmp/pancake-edge.env <<'EOF'
          E2E_ADMIN_SECRET=local-release-soak-secret
          NBA_CDN_BASE_URL=http://127.0.0.1:4555/static/json
          SLEEPER_BASE_URL=http://127.0.0.1:4555/v1
          EXPO_PUSH_URL=http://127.0.0.1:4555/--/api/v2/push/send
          EOF
          supabase functions serve --env-file /tmp/pancake-edge.env > tests/artifacts/stack/edge.log 2>&1 &
          EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH=1 npm run build:web:release > tests/artifacts/stack/web-build.log 2>&1
          node tests/e2e/static-web-server.mjs --root=dist --port=8082 > tests/artifacts/stack/web.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8082 >/dev/null &&
              curl --fail --silent "$API_URL/functions/v1/api/health" >/dev/null; then
              npm run e2e:web-hydration
              exit 0
            fi
            sleep 2
          done
          cat tests/artifacts/stack/web.log
          cat tests/artifacts/stack/edge.log
          exit 1
      - name: Seed release fixture
        run: npm run e2e:seed
      - name: Run coverage-enforcing soak
        run: npm run e2e:soak:release
      - name: Measure post-migration ranked workflow data latency
        run: npm run e2e:data-latency
      - name: Enforce browser and data performance budgets
        run: npm run perf:budget -- --require-report --require-data-report --require-workflow-reports --require-season-reports=20
      - name: Retain soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-soak-evidence
          path: |
            tests/e2e-report.md
            tests/e2e-coverage.md
            tests/e2e-browser-*-report.md
            tests/e2e-browser-*-report.json
            tests/e2e-data-latency-report.md
            tests/e2e-seed-report.md
            tests/performance-budget-report.md
            tests/artifacts/
            tests/snapshots/
          if-no-files-found: error
          retention-days: 30
