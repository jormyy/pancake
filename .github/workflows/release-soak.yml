name: Release soak

on:
  workflow_call:
    outputs:
      migration_plan_sha256:
        description: Exact attested history and pending plan exercised by the soak
        value: ${{ jobs.release-soak.outputs.migration_plan_sha256 }}
    inputs:
      release_sha:
        description: Full main-branch Git SHA to soak
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch Git SHA to soak
        required: true
        type: string
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: release-soak-${{ github.ref }}
  cancel-in-progress: false

# The 20-season soak needs about six hours, longer than one hosted job may run. It runs
# as a chain of shards: each runs a contiguous block of the same simulated seasons and
# hands the next shard its database volume and soak checkpoint, so every cross-season
# check sees one continuous run. The production plan is attested once here, and the
# final shard re-attests it before the soak can pass.
jobs:
  release-soak:
    name: Attest deployed baseline and migration plan
    outputs:
      migration_plan_sha256: ${{ steps.migration-plan.outputs.sha256 }}
      deployed_frontend_sha: ${{ steps.baseline.outputs.deployed_frontend_sha }}
      deployed_frontend_digest: ${{ steps.baseline.outputs.deployed_frontend_digest }}
      deployed_edge_sha: ${{ steps.baseline.outputs.deployed_edge_sha }}
      deployed_edge_digest: ${{ steps.baseline.outputs.deployed_edge_digest }}
      deployed_schema_version: ${{ steps.migration-plan.outputs.deployed_schema_version }}
      pending_files: ${{ steps.migration-plan.outputs.pending_files }}
      pending_versions: ${{ steps.migration-plan.outputs.pending_versions }}
      repository_head: ${{ steps.migration-plan.outputs.repository_head }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      E2E_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      E2E_PRODUCTION_SUPABASE_REF: ceeytbfmwsnzalxlkalc
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.PANCAKE_API_URL }}
      E2E_PRODUCTION_FRONTEND_URL: ${{ secrets.PANCAKE_FRONTEND_URL }}
      E2E_EXPECTED_FRONTEND_HOST: ${{ secrets.PANCAKE_PRODUCTION_FRONTEND_HOST }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1
      - run: npm ci
      - name: Resolve deployed production baseline
        id: baseline
        shell: bash
        run: |
          [[ "$E2E_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$E2E_RELEASE_SHA"
          git merge-base --is-ancestor HEAD origin/main
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF \
            EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_API_URL \
            E2E_PRODUCTION_FRONTEND_URL E2E_EXPECTED_FRONTEND_HOST; do
            test -n "${!name:-}" || { echo "Missing protected release-soak credential: $name"; exit 1; }
          done
          node tests/e2e/validate-production-target.mjs
          node -e '
            const [value, expected] = process.argv.slice(1)
            const url = new URL(value)
            if (url.protocol !== "https:" || url.hostname !== expected) process.exit(1)
          ' "$E2E_PRODUCTION_FRONTEND_URL" "$E2E_EXPECTED_FRONTEND_HOST"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          test "$(cat supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF"
          supabase db query --linked --agent=no -o json \
            -f tests/e2e/release-schema-history.sql \
            > /tmp/deployed-schema-history.json
          node tests/e2e/release-baseline-provenance.mjs > /tmp/deployed-release.json
          deployed_frontend_sha="$(node -e 'process.stdout.write(require("/tmp/deployed-release.json").frontend.commitSha)')"
          deployed_frontend_digest="$(node -e 'process.stdout.write(require("/tmp/deployed-release.json").frontend.bundleDigest)')"
          deployed_edge_sha="$(node -e 'process.stdout.write(require("/tmp/deployed-release.json").edge.commitSha)')"
          deployed_edge_digest="$(node -e 'process.stdout.write(require("/tmp/deployed-release.json").edge.edgeArtifactDigest)')"
          for deployed_sha in "$deployed_frontend_sha" "$deployed_edge_sha"; do
            git cat-file -e "$deployed_sha^{commit}"
            git merge-base --is-ancestor "$deployed_sha" "$E2E_RELEASE_SHA"
          done
          printf 'deployed_frontend_sha=%s\n' "$deployed_frontend_sha" >> "$GITHUB_OUTPUT"
          printf 'deployed_frontend_digest=%s\n' "$deployed_frontend_digest" >> "$GITHUB_OUTPUT"
          printf 'deployed_edge_sha=%s\n' "$deployed_edge_sha" >> "$GITHUB_OUTPUT"
          printf 'deployed_edge_digest=%s\n' "$deployed_edge_digest" >> "$GITHUB_OUTPUT"
      - name: Attest migration plan
        id: migration-plan
        shell: bash
        run: |
          mapfile -t migration_names < <(find supabase/migrations -maxdepth 1 -name '*.sql' -exec basename {} \; | sort)
          plan="$(node tests/e2e/release-soak-migration-plan.mjs --history-file /tmp/deployed-schema-history.json --project-ref "$SUPABASE_PROJECT_REF" "${migration_names[@]}")"
          plan_sha256="$(printf '%s' "$plan" | node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(0)).digest("hex"))')"
          printf 'sha256=%s\n' "$plan_sha256" >> "$GITHUB_OUTPUT"
          node -e '
            const plan = JSON.parse(process.argv[1])
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, [
              `deployed_schema_version=${plan.deployedVersion}`,
              `pending_files=${JSON.stringify(plan.pendingFiles)}`,
              `pending_versions=${JSON.stringify(plan.pendingVersions)}`,
              `repository_head=${plan.repositoryHead}`,
            ].join("\n") + "\n")
          ' "$plan"

  soak-shard-1:
    name: Soak shard 1 of 4
    needs: [release-soak]
    uses: ./.github/workflows/release-soak-shard.yml
    with:
      release_sha: ${{ inputs.release_sha || github.sha }}
      shard: 1
      shard_count: 4
      migration_plan_sha256: ${{ needs.release-soak.outputs.migration_plan_sha256 }}
      deployed_frontend_sha: ${{ needs.release-soak.outputs.deployed_frontend_sha }}
      deployed_frontend_digest: ${{ needs.release-soak.outputs.deployed_frontend_digest }}
      deployed_edge_sha: ${{ needs.release-soak.outputs.deployed_edge_sha }}
      deployed_edge_digest: ${{ needs.release-soak.outputs.deployed_edge_digest }}
      deployed_schema_version: ${{ needs.release-soak.outputs.deployed_schema_version }}
      pending_files: ${{ needs.release-soak.outputs.pending_files }}
      pending_versions: ${{ needs.release-soak.outputs.pending_versions }}
      repository_head: ${{ needs.release-soak.outputs.repository_head }}
    secrets: inherit
  soak-shard-2:
    name: Soak shard 2 of 4
    needs: [release-soak, soak-shard-1]
    uses: ./.github/workflows/release-soak-shard.yml
    with:
      release_sha: ${{ inputs.release_sha || github.sha }}
      shard: 2
      shard_count: 4
      migration_plan_sha256: ${{ needs.release-soak.outputs.migration_plan_sha256 }}
      deployed_frontend_sha: ${{ needs.release-soak.outputs.deployed_frontend_sha }}
      deployed_frontend_digest: ${{ needs.release-soak.outputs.deployed_frontend_digest }}
      deployed_edge_sha: ${{ needs.release-soak.outputs.deployed_edge_sha }}
      deployed_edge_digest: ${{ needs.release-soak.outputs.deployed_edge_digest }}
      deployed_schema_version: ${{ needs.release-soak.outputs.deployed_schema_version }}
      pending_files: ${{ needs.release-soak.outputs.pending_files }}
      pending_versions: ${{ needs.release-soak.outputs.pending_versions }}
      repository_head: ${{ needs.release-soak.outputs.repository_head }}
    secrets: inherit
  soak-shard-3:
    name: Soak shard 3 of 4
    needs: [release-soak, soak-shard-2]
    uses: ./.github/workflows/release-soak-shard.yml
    with:
      release_sha: ${{ inputs.release_sha || github.sha }}
      shard: 3
      shard_count: 4
      migration_plan_sha256: ${{ needs.release-soak.outputs.migration_plan_sha256 }}
      deployed_frontend_sha: ${{ needs.release-soak.outputs.deployed_frontend_sha }}
      deployed_frontend_digest: ${{ needs.release-soak.outputs.deployed_frontend_digest }}
      deployed_edge_sha: ${{ needs.release-soak.outputs.deployed_edge_sha }}
      deployed_edge_digest: ${{ needs.release-soak.outputs.deployed_edge_digest }}
      deployed_schema_version: ${{ needs.release-soak.outputs.deployed_schema_version }}
      pending_files: ${{ needs.release-soak.outputs.pending_files }}
      pending_versions: ${{ needs.release-soak.outputs.pending_versions }}
      repository_head: ${{ needs.release-soak.outputs.repository_head }}
    secrets: inherit
  soak-shard-4:
    name: Soak shard 4 of 4
    needs: [release-soak, soak-shard-3]
    uses: ./.github/workflows/release-soak-shard.yml
    with:
      release_sha: ${{ inputs.release_sha || github.sha }}
      shard: 4
      shard_count: 4
      migration_plan_sha256: ${{ needs.release-soak.outputs.migration_plan_sha256 }}
      deployed_frontend_sha: ${{ needs.release-soak.outputs.deployed_frontend_sha }}
      deployed_frontend_digest: ${{ needs.release-soak.outputs.deployed_frontend_digest }}
      deployed_edge_sha: ${{ needs.release-soak.outputs.deployed_edge_sha }}
      deployed_edge_digest: ${{ needs.release-soak.outputs.deployed_edge_digest }}
      deployed_schema_version: ${{ needs.release-soak.outputs.deployed_schema_version }}
      pending_files: ${{ needs.release-soak.outputs.pending_files }}
      pending_versions: ${{ needs.release-soak.outputs.pending_versions }}
      repository_head: ${{ needs.release-soak.outputs.repository_head }}
    secrets: inherit
