name: Release soak

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

jobs:
  release-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci
      - name: Start release stack
        shell: bash
        run: |
          probe_name="$(node -p "require('./tests/e2e/midlife-migration.json').filename")"
          head_name="$(find supabase/migrations -maxdepth 1 -name '*.sql' -exec basename {} \; | sort | tail -1)"
          test "$probe_name" = "$head_name" || {
            echo "Mid-life probe $probe_name is not repository head $head_name"
            exit 1
          }
          probe_version="${probe_name%%_*}"
          probe_migration="supabase/migrations/$probe_name"
          mv "$probe_migration" "/tmp/$probe_name"
          trap 'mv "/tmp/$probe_name" "$probe_migration"' EXIT
          supabase start
          mv "/tmp/$probe_name" "$probe_migration"
          trap - EXIT
          source <(supabase status -o env)
          export EXPO_PUBLIC_SUPABASE_URL="$API_URL"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export EXPO_PUBLIC_API_URL="$API_URL/functions/v1/api"
          printf 'E2E_SUPABASE_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'E2E_PANCAKE_SUPABASE_SECRET_KEY=%s\n' "$SECRET_KEY" >> "$GITHUB_ENV"
          printf 'E2E_SUPABASE_PUBLISHABLE_KEY=%s\n' "$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          printf 'SUPABASE_DB_URL=%s\n' "$DB_URL" >> "$GITHUB_ENV"
          printf 'E2E_API_BASE_URL=%s/functions/v1/api\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'E2E_FRONTEND_URL=http://127.0.0.1:8082\n' >> "$GITHUB_ENV"
          printf 'E2E_ADMIN_SECRET=local-release-soak-secret\n' >> "$GITHUB_ENV"
          printf 'E2E_MIDLIFE_EXPECTED_VERSION=%s\n' "$probe_version" >> "$GITHUB_ENV"
          printf 'FAKE_UPSTREAM_PORT=4555\n' >> "$GITHUB_ENV"
          cat > /tmp/pancake-edge.env <<'EOF'
          E2E_ADMIN_SECRET=local-release-soak-secret
          NBA_CDN_BASE_URL=http://127.0.0.1:4555/static/json
          SLEEPER_BASE_URL=http://127.0.0.1:4555/v1
          EXPO_PUSH_URL=http://127.0.0.1:4555/--/api/v2/push/send
          EOF
          supabase functions serve --env-file /tmp/pancake-edge.env > /tmp/pancake-edge.log 2>&1 &
          CI=1 npx expo start --web --port 8082 > /tmp/pancake-web.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8082 >/dev/null &&
              curl --fail --silent "$API_URL/functions/v1/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pancake-web.log
          cat /tmp/pancake-edge.log
          exit 1
      - name: Seed release fixture
        run: npm run e2e:seed
      - name: Run coverage-enforcing soak
        run: npm run e2e:soak:release
      - name: Retain soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-soak-evidence
          path: |
            tests/e2e-report.md
            tests/e2e-coverage.md
            tests/e2e-browser-*-report.md
            tests/e2e-browser-*-report.json
            tests/artifacts/
