name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch Git SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release-soak:
    name: Require deployed-to-HEAD release soak
    uses: ./.github/workflows/release-soak.yml
    with:
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  deploy-candidate:
    name: Build and deploy candidate
    needs: release-soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    outputs:
      frontend_bundle_digest: ${{ steps.release.outputs.bundle_digest }}
      edge_artifact_digest: ${{ steps.edge-release.outputs.edge_artifact_digest }}
      candidate_url: ${{ steps.deploy.outputs.candidate_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      E2E_PRODUCTION_SUPABASE_REF: ceeytbfmwsnzalxlkalc
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.PANCAKE_API_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Verify protected deployment inputs
        shell: bash
        run: |
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
          git merge-base --is-ancestor HEAD origin/main
          test "$SUPABASE_PROJECT_REF" = 'ceeytbfmwsnzalxlkalc'
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN \
            EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_API_URL; do
            test -n "${!name:-}" || { echo "Missing protected deployment credential: $name"; exit 1; }
          done
          node tests/e2e/validate-production-target.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build immutable Vercel candidate
        shell: bash
        run: |
          npx --yes vercel@55.0.0 pull --yes --environment=preview --token "$VERCEL_TOKEN"
          PANCAKE_RELEASE_SHA="${{ inputs.release_sha }}" \
            EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH=1 \
            npx --yes vercel@55.0.0 build --token "$VERCEL_TOKEN"

      - name: Read and verify release marker
        id: release
        shell: bash
        run: |
          marker=.vercel/output/static/release-provenance.json
          test -f "$marker" || { echo "Vercel output omitted release-provenance.json"; exit 1; }
          test "$(node -e "process.stdout.write(require('./$marker').commitSha)")" = "${{ inputs.release_sha }}"
          digest="$(node -e "process.stdout.write(require('./$marker').bundleDigest)")"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "bundle_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Bake Edge artifact provenance
        id: edge-release
        env:
          PANCAKE_RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/stamp-edge-release-provenance.mjs

      - name: Deploy Edge release candidate
        shell: bash
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy unpromoted frontend candidate
        id: deploy
        shell: bash
        run: |
          candidate_url="$(npx --yes vercel@55.0.0 deploy --prebuilt --token "$VERCEL_TOKEN")"
          [[ "$candidate_url" =~ ^https://[^/]+$ ]]
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"

  verify-candidate:
    name: Require candidate readiness
    needs: deploy-candidate
    uses: ./.github/workflows/production-readiness.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      frontend_bundle_digest: ${{ needs.deploy-candidate.outputs.frontend_bundle_digest }}
      edge_artifact_digest: ${{ needs.deploy-candidate.outputs.edge_artifact_digest }}
      frontend_url: ${{ needs.deploy-candidate.outputs.candidate_url }}
      candidate_frontend: true
    secrets: inherit

  promote:
    name: Promote verified candidate
    needs: [deploy-candidate, verify-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Promote candidate to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@55.0.0 promote "${{ needs.deploy-candidate.outputs.candidate_url }}" --yes --token "$VERCEL_TOKEN"

  verify-production:
    name: Verify promoted production
    needs: [deploy-candidate, promote]
    uses: ./.github/workflows/production-readiness.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      frontend_bundle_digest: ${{ needs.deploy-candidate.outputs.frontend_bundle_digest }}
      edge_artifact_digest: ${{ needs.deploy-candidate.outputs.edge_artifact_digest }}
    secrets: inherit
