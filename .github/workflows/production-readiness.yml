name: Hosted production readiness

on:
  workflow_call:
    inputs:
      release_sha:
        description: Full Git SHA deployed by the caller
        required: true
        type: string
      frontend_bundle_digest:
        description: SHA-256 digest emitted by build:web:release
        required: true
        type: string
      edge_artifact_digest:
        description: SHA-256 digest baked into the deployed Edge artifact
        required: true
        type: string
      frontend_url:
        description: Candidate frontend URL; omitted for the pinned production hostname
        required: false
        type: string
      candidate_frontend:
        description: Allow a Vercel candidate URL from the repository-owned deploy job
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git SHA deployed to production
        required: true
        type: string
      frontend_bundle_digest:
        description: SHA-256 digest emitted by build:web:release
        required: true
        type: string
      edge_artifact_digest:
        description: SHA-256 digest baked into the deployed Edge artifact
        required: true
        type: string
  repository_dispatch:
    types: [production_deployed]

permissions:
  contents: read

concurrency:
  group: hosted-production-readiness
  cancel-in-progress: false

jobs:
  verify-production:
    name: Verify hosted production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      E2E_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      E2E_PANCAKE_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      E2E_REMOTE_API_URL: ${{ secrets.PANCAKE_API_URL }}
      EXPO_PUBLIC_API_URL: ${{ secrets.PANCAKE_API_URL }}
      PANCAKE_EDGE_INTERNAL_TOKEN: ${{ secrets.PANCAKE_EDGE_INTERNAL_TOKEN }}
      PANCAKE_LEGACY_SUPABASE_JWT_ROTATED: ${{ secrets.PANCAKE_LEGACY_SUPABASE_JWT_ROTATED }}
      E2E_FRONTEND_URL: ${{ inputs.frontend_url || secrets.PANCAKE_FRONTEND_URL }}
      E2E_EXPECTED_FRONTEND_HOST: ${{ secrets.PANCAKE_PRODUCTION_FRONTEND_HOST }}
      E2E_ALLOW_CANDIDATE_FRONTEND: ${{ inputs.candidate_frontend && '1' || '0' }}
      E2E_PRODUCTION_SUPABASE_REF: ceeytbfmwsnzalxlkalc
      E2E_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_sha || inputs.release_sha }}
      E2E_EXPECTED_FRONTEND_BUNDLE_DIGEST: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.frontend_bundle_digest || inputs.frontend_bundle_digest }}
      E2E_EXPECTED_EDGE_ARTIFACT_DIGEST: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.edge_artifact_digest || inputs.edge_artifact_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_sha || inputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Require protected production credentials
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF \
            E2E_SUPABASE_URL E2E_SUPABASE_PUBLISHABLE_KEY E2E_PANCAKE_SUPABASE_SECRET_KEY \
            E2E_REMOTE_API_URL PANCAKE_EDGE_INTERNAL_TOKEN PANCAKE_LEGACY_SUPABASE_JWT_ROTATED; do
            test -n "${!name:-}" || { echo "Missing protected production credential: $name"; exit 1; }
          done
          test -n "$E2E_FRONTEND_URL" || { echo "Missing protected production credential: E2E_FRONTEND_URL"; exit 1; }
          if test "$E2E_ALLOW_CANDIDATE_FRONTEND" != '1'; then
            test -n "$E2E_EXPECTED_FRONTEND_HOST" || { echo "Missing protected production credential: E2E_EXPECTED_FRONTEND_HOST"; exit 1; }
          fi
          test "$SUPABASE_PROJECT_REF" = "$E2E_PRODUCTION_SUPABASE_REF"
          test "$PANCAKE_LEGACY_SUPABASE_JWT_ROTATED" = '1'
          [[ "$E2E_EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$E2E_EXPECTED_FRONTEND_BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$E2E_EXPECTED_EDGE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$E2E_EXPECTED_RELEASE_SHA"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install dependencies
        run: npm ci

      - name: Rebuild intended frontend release
        shell: bash
        run: |
          EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH=1 npm run build:web:release
          actual_digest="$(node -e "process.stdout.write(require('./dist/release-provenance.json').bundleDigest)")"
          test "$actual_digest" = "$E2E_EXPECTED_FRONTEND_BUNDLE_DIGEST" || {
            echo "Rebuilt bundle digest $actual_digest does not match intended $E2E_EXPECTED_FRONTEND_BUNDLE_DIGEST"
            exit 1
          }

      - name: Rebuild intended Edge artifact provenance
        shell: bash
        run: |
          marker="$(PANCAKE_RELEASE_SHA="$E2E_EXPECTED_RELEASE_SHA" node scripts/stamp-edge-release-provenance.mjs)"
          actual_digest="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).edgeArtifactDigest)' "$marker")"
          test "$actual_digest" = "$E2E_EXPECTED_EDGE_ARTIFACT_DIGEST" || {
            echo "Rebuilt Edge digest $actual_digest does not match intended $E2E_EXPECTED_EDGE_ARTIFACT_DIGEST"
            exit 1
          }

      - name: Link protected production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify deployed Edge and frontend provenance
        run: node tests/e2e/hosted-release-provenance.mjs

      - name: Verify hosted frontend hydration
        run: npm run e2e:web-hydration

      - name: Verify production configuration and deployment
        run: npm run prod:check

      - name: Verify production data sources and schema
        run: npm run prod:data-health -- --linked --allow-prod-writes

      - name: Verify linked Edge authentication
        run: npm run security:edge-auth:linked -- --positive

      - name: Verify linked database security catalog
        run: npm run security:db-catalog -- --linked

      - name: Retain production readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-production-readiness-${{ github.run_id }}
          path: |
            tests/production-readiness-report.md
            tests/prod-data-source-health-report.md
            tests/edge-internal-auth-report.md
            tests/db-security-catalog-report.md
            tests/hosted-release-provenance-report.md
            tests/artifacts/stack/production-hydration.json
            tests/artifacts/stack/production-hydration-console.txt
            tests/artifacts/stack/production-hydration-errors.txt
            dist/release-provenance.json
          if-no-files-found: error
          retention-days: 30
