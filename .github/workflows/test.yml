name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    name: Frontend lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck app
        run: npm run typecheck

      - name: Run tests (incl. scoring-parity + RLS-grant security guards)
        run: npm test

      - name: Typecheck core
        run: npm run typecheck --workspace core

      - name: Run core tests
        run: npm test --workspace core

  test-edge:
    name: Supabase Edge checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge functions
        run: npm run check:edge-functions

      - name: Check generated Edge shared code
        run: npm run check:edge-shared
