name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    name: Frontend lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: Repository quality gates
        run: npm run check:quality

      - name: Run app and core tests
        run: npm run test:workspaces

  test-edge:
    name: Supabase Edge checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge functions
        run: npm run check:edge-functions

  test-database:
    name: Supabase migration and trade integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start Supabase from repository migrations
        run: supabase start

      - name: Verify migration head and multi-team trade behavior
        shell: bash
        run: |
          source <(supabase status -o env)
          supabase migration list --local --agent yes \
            | jq -e '.migrations | length > 0 and all(.[]; .local == .remote)'
          E2E_SUPABASE_URL="$API_URL" \
          SUPABASE_DB_URL="$DB_URL" \
          E2E_PANCAKE_SUPABASE_SECRET_KEY="$SECRET_KEY" \
          E2E_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          npm run test:db

  test-browser:
    name: Browser trade smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local app stack
        shell: bash
        run: |
          supabase start
          CI=1 npx expo start --web --port 8082 > /tmp/pancake-web.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8082 >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/pancake-web.log
          exit 1

      - name: Run standard trade browser flow
        shell: bash
        run: |
          source <(supabase status -o env)
          E2E_SUPABASE_URL="$API_URL" \
          E2E_PANCAKE_SUPABASE_SECRET_KEY="$SECRET_KEY" \
          E2E_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          E2E_API_BASE_URL="$API_URL/functions/v1/api" \
          E2E_FRONTEND_URL="http://127.0.0.1:8082" \
          npm run e2e:browser-trade
